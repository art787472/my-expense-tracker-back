# .github/workflows/deploy.yml
name: Deploy to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-1
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
    
    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: expense-tracker
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
    
    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: expense-tracker
      run: |
        echo "$SSH_PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} << 'EOF'
          # 先設定必要環境變數
          export ECR_REGISTRY=070648248469.dkr.ecr.ap-northeast-1.amazonaws.com
          export ECR_REPOSITORY=expense-tracker
          export IMAGE_TAG=latest  # 或使用你想的 tag

          # Login to ECR
          aws ecr get-login-password --region ap-northeast-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

          # Pull latest image
          sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # Stop and remove old container
          sudo docker stop expense-tracker || true
          sudo docker rm expense-tracker || true

          # Run new container
          sudo docker run -d \
            --name expense-tracker \
            -p 5000:8080 \
            --restart unless-stopped \
            --env-file /home/ubuntu/env/.env \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # Clean up old images
          sudo docker image prune -af
        EOF