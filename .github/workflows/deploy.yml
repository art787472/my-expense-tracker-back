name: Deploy via OIDC + SSM

on:
  push:
    branches:
      - master   # 或你的分支名稱

permissions:
  id-token: write      # 必須有這行，允許 OIDC token 發行
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::070648248469:role/githubRole
          aws-region: ap-northeast-1

      - name: Test SSM connection
        run: aws ssm describe-instance-information

      - name: Allow insecure Docker registry
        run: |
          echo '{"insecure-registries": ["176.34.11.226:5001"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Build and push Docker image
        env:
          REGISTRY_URL: 176.34.11.226:5001
          IMAGE_NAME: expense-tracker
        run: |
          docker build -t $IMAGE_NAME:latest .
          docker tag $IMAGE_NAME:latest $REGISTRY_URL/$IMAGE_NAME:latest
          docker push $REGISTRY_URL/$IMAGE_NAME:latest

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids i-07643b311c583674e \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Action" \
            --parameters 'commands=["sudo su && cd /app && docker-compose pull && docker-compose down && docker-compose up -d"]'
