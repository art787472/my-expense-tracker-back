version: "3.9"

services:
  web:
    image: expensetracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    env_file:
      - .env
    restart: always
    networks:
      - webnet

  mongo:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: myuser
      MONGO_INITDB_ROOT_PASSWORD: mypassword
    volumes:
      - mongo-data:/data/db
    networks:
      - webnet

networks:
  webnet:

volumes:
  mongo-data: